name: Release

on:
  push:
    tags: ['v*']
  # Manual execution is a build/test rehearsal; it never publishes or deploys.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jumpnshoot-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag pointing to main
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || {
              echo 'Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease' >&2; exit 1;
            }
            git merge-base --is-ancestor HEAD origin/main || {
              echo 'Release commit must belong to main' >&2; exit 1;
            }
            version="$GITHUB_REF_NAME"
          else
            version="dryrun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      full: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      BUILD_VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: build/releases/${{ needs.validate.outputs.version }}
      - name: Check immutable release and artifact identity
        run: |
          if gh release view "$BUILD_VERSION" > /dev/null 2>&1; then
            echo 'Release already exists; create a new version tag' >&2; exit 1
          fi
          cd "build/releases/$BUILD_VERSION"
          sha256sum --check --ignore-missing SHA256SUMS
          mkdir server-linux
          tar -xzf jumpnshoot-server-linux-*.tar.gz -C server-linux
          sha256sum --check --ignore-missing SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('BUILD.json').read_text())
          assert metadata['commit'] == os.environ['GITHUB_SHA'], 'Artifact commit differs from release commit'
          assert metadata['version'] == os.environ['BUILD_VERSION'], 'Artifact version differs from tag'
          assert metadata['dirty'] is False, 'Release must come from a clean checkout'
          assert metadata['packaged'] is True, 'Release requires packaged exports'
          assert set(metadata['targets']) == {'client-linux', 'client-windows', 'server-linux', 'server-windows'}, 'Release requires all four targets'
          PY
      - name: Publish the runtime containing the tested Linux executable
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jumpnshoot-server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f docker/server.Dockerfile \
            --build-arg "RELEASE_DIR=build/releases/$BUILD_VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$BUILD_VERSION" \
            --label "org.opencontainers.image.title=Jump'n'Shoot Server" \
            -t "$image:$BUILD_VERSION" .
          expected="$(sha256sum "build/releases/$BUILD_VERSION/server-linux/jumpnshoot-server.x86_64" | cut -d ' ' -f 1)"
          actual="$(docker run --rm --entrypoint sha256sum "$image:$BUILD_VERSION" /app/jumpnshoot-server.x86_64 | cut -d ' ' -f 1)"
          [[ "$expected" == "$actual" ]]
          docker push "$image:$BUILD_VERSION"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$BUILD_VERSION")"
          [[ "$digest" == "$image@sha256:"* ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          export RELEASE_IMAGE="$digest"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/image.json').write_text(json.dumps({
              'image': os.environ['RELEASE_IMAGE'], 'commit': os.environ['GITHUB_SHA'],
              'version': os.environ['BUILD_VERSION']}, indent=2) + '\n')
          PY
      - name: Publish player and dedicated server downloads
        run: |
          assets=("build/releases/$BUILD_VERSION/"*.zip "build/releases/$BUILD_VERSION/"*.tar.gz
                  "build/releases/$BUILD_VERSION/BUILD.json" "build/releases/$BUILD_VERSION/SHA256SUMS" build/image.json)
          options=(--verify-tag --title "Jump'n'Shoot $BUILD_VERSION" --generate-notes)
          [[ "$BUILD_VERSION" != *-* ]] || options+=(--prerelease)
          gh release create "$BUILD_VERSION" "${assets[@]}" "${options[@]}"
      - name: Remove this runner's registry credentials
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update VPS, verify ENet and roll back if needed
        env:
          SERVER_IMAGE: ${{ needs.publish.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR }}
          VPS_GAME_PORT: ${{ vars.VPS_GAME_PORT }}
        run: bash scripts/deploy-vps.sh
